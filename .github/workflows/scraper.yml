name: News Scraper Automation

on:
  schedule:
    # Hər gün saat 08:00-da avtomatik çalışması üçün
    - cron: '0 8 * * *'
  workflow_dispatch: # İstədiyin an manual olaraq işə salmaq üçün

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository-ni kopyala
      uses: actions/checkout@v3

    - name: Python mühitini qur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Lazımi kitabxanaları quraşdır
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml

    - name: Scraper skriptini çalışdır
      run: python news_scraper.py

    - name: Yenilənmiş xəbərləri (JSON) GitHub-a commit et
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add latest_news.json
        git commit -m "Auto-update news: $(date)" || exit 0
        git push
